# AgentHopper commit gate. Install once per clone:  lefthook install
# Source template: ~/.devsystem/rules/templates/lefthook.yml
pre-commit:
  commands:
    protected-strings:
      priority: 1
      run: gitleaks protect --staged --no-banner --redact --config ~/.devsystem/private/guards/gitleaks.toml
    docs-index:
      priority: 2
      run: ~/.devsystem/rules/scripts/devsystem index --repo . --stage
    docs-lint:
      priority: 3
      run: ~/.devsystem/rules/scripts/devsystem lint --repo . --staged-only
